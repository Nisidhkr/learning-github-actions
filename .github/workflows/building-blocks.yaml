name: building-blocks
on: push

jobs:
    echo-hello:
        runs-on: ubuntu-latest
        steps:
            - name: Echo message
              run: echo "Hello, World!"
    echo-goodbye:
        runs-on: ubuntu-latest
        steps:
            - name: Failed step
              run:
                echo "This step will fail" &&
                exit 1

            - name: Echo goodbye message
              run: echo "Goodbye, World!"